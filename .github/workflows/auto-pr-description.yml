name: Auto PR Description

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate PR description with OpenAI
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pr.number;

            // 1) Không đè mô tả nếu người viết đã có nội dung và không chứa marker
            const existing = pr.body || "";
            const HAS_MARKER = existing.includes("<!-- AI:ALLOW_EDIT -->");
            if (existing && !HAS_MARKER) {
              core.info("PR already has description. Skipping.");
              return;
            }

            // 2) Lấy các file thay đổi + commits để làm ngữ cảnh
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: prNumber, per_page: 100 }
            );
            const fileSumm = files.map(f => `- ${f.status.toUpperCase()}: ${f.filename} (${f.changes} changes)`).join("\n").slice(0, 12000);

            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              { owner, repo, pull_number: prNumber, per_page: 100 }
            );
            const commitSumm = commits.map(c => `- ${c.sha.slice(0,7)}: ${c.commit.message.split("\n")[0]}`).join("\n").slice(0, 8000);

            // 3) Prompt cho OpenAI
            const prompt = `You are a senior reviewer. Write a clear Pull Request description from the context.
            Return Markdown with sections: Summary, Scope, Changes, Risks, Test Plan, Breaking Changes, Checklist.
            Use bullet points. Keep it concise.

            Context:
            PR title: ${pr.title}
            Branch: ${pr.head.ref} -> ${pr.base.ref}

            Changed files:
            ${fileSumm}

            Commits:
            ${commitSumm}`;

            // 4) Gọi OpenAI (GPT-4o-mini là ví dụ; thay model tùy bạn)
            const res = await fetch("https://api.openai.com/v1/chat/completions", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${process.env.OPENAI_API_KEY}`
              },
              body: JSON.stringify({
                model: "gpt-4o-mini",
                messages: [{ role: "user", content: prompt }],
                temperature: 0.2
              })
            });
            if (!res.ok) {
              const text = await res.text();
              core.setFailed(`OpenAI error: ${res.status} ${text}`);
              return;
            }
            const data = await res.json();
            const ai = data.choices?.[0]?.message?.content?.trim() || "";

            // 5) Ghép marker để lần sau cho phép bot cập nhật tiếp (nếu muốn)
            const newBody = `<!-- AI:ALLOW_EDIT -->\n${ai}\n`;

            // 6) Cập nhật body PR
            await github.rest.pulls.update({
              owner, repo, pull_number: prNumber, body: newBody
            });

            core.info("PR description updated by AI.");
