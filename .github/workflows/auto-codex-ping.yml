name: Auto ping Codex on PR

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Codex if needed
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const pr = context.payload.pull_request;
            const prNumber = pr.number;

            const body = (pr.body || "").trim();
            const allowEdit = body.includes("<!-- AI:ALLOW_EDIT -->");

            // Chỉ ping nếu body trống hoặc có marker cho phép chỉnh
            if (body && !allowEdit) {
              core.info("PR has manual description without marker. Skip ping.");
              return;
            }

            // Tránh spam: nếu đã có comment gọi Codex rồi thì bỏ qua
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber, per_page: 100
            });
            const alreadyPinged = comments.some(c =>
              /@codex\s+(summarize-pr|review|describe|summary)/i.test(c.body || "")
            );
            if (alreadyPinged) {
              core.info("Codex already pinged. Skip.");
              return;
            }

            // Gửi lệnh cho Codex (đổi 'summarize-pr' theo bot của bạn)
            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber,
              body: "@codex summarize-pr"
            });

            core.info("Pinged Codex.");
